<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golf Oly Pay</title>
  <meta name="theme-color" content="#0f5132" />
  <style>
    :root{
      --green:#0f5132;
      --green2:#198754;
      --bg:#f5f7f6;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#dfe5e2;
      --danger:#b42318;
      --gold:#d4a017;
      --silver:#7c8794;
      --bronze:#a86f32;
      --iron:#44515e;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header{
      background:linear-gradient(135deg,var(--green),var(--green2));
      color:white;
      padding:18px 16px;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    }
    header h1{margin:0;font-size:1.25rem}
    header p{margin:4px 0 0;font-size:.82rem;opacity:.9}
    main{max-width:980px;margin:auto;padding:14px}
    .tabs{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:6px;
      margin-bottom:12px;
    }
    .tab-btn{
      border:none;
      padding:10px 6px;
      border-radius:10px;
      background:#e6ece9;
      font-weight:700;
      cursor:pointer;
      font-size:.83rem;
    }
    .tab-btn.active{background:var(--green);color:#fff}
    .panel{display:none}
    .panel.active{display:block}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
    }
    h2,h3{margin-top:0}
    h2{font-size:1.1rem}
    h3{font-size:1rem}
    label{display:block;font-weight:700;font-size:.9rem;margin-bottom:5px}
    input,select,button,textarea{
      font:inherit;
    }
    input,select{
      width:100%;
      border:1px solid #cfd8d3;
      border-radius:9px;
      padding:10px;
      background:#fff;
    }
    .grid{display:grid;gap:10px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .btn{
      border:none;
      border-radius:10px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn-primary{background:var(--green);color:#fff}
    .btn-secondary{background:#e6ece9;color:var(--text)}
    .btn-danger{background:#fee4e2;color:var(--danger)}
    .btn-block{width:100%}
    .player-row{
      display:grid;
      grid-template-columns:42px 1fr 42px;
      gap:8px;
      align-items:center;
      margin-bottom:8px;
    }
    .player-no{
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#e8f3ed;color:var(--green);font-weight:900;
    }
    .hole-head{
      display:flex;justify-content:space-between;align-items:center;gap:8px;
      margin-bottom:10px;
    }
    .hole-nav{display:flex;gap:6px}
    .medal{
      border-left:5px solid;
      padding-left:10px;
    }
    .iron{border-color:var(--iron)}
    .bronze{border-color:var(--bronze)}
    .silver{border-color:var(--silver)}
    .gold{border-color:var(--gold)}
    .summary-table,.settle-table{
      width:100%;border-collapse:collapse;font-size:.9rem;
    }
    th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}
    th{background:#f0f4f2}
    .positive{color:#087443;font-weight:900}
    .negative{color:var(--danger);font-weight:900}
    .muted{color:var(--muted);font-size:.85rem}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{
      background:#eef3f0;border:1px solid var(--line);
      border-radius:999px;padding:5px 9px;font-size:.82rem;
    }
    .selected-hole{background:#dff4e8;border-color:#8ad2a7;color:#0d5d35;font-weight:800}
    .notice{
      padding:10px 12px;border-radius:10px;background:#fff4ce;border:1px solid #f0d36d;
      font-size:.88rem;
    }
    .success{
      padding:10px 12px;border-radius:10px;background:#dcfae6;border:1px solid #86d49f;
      color:#0d5d35;font-weight:700;
    }
    footer{padding:20px;text-align:center;color:var(--muted);font-size:.8rem}
    @media(max-width:700px){
      .tabs{grid-template-columns:repeat(5,1fr)}
      .tab-btn{font-size:.72rem;padding:9px 2px}
      .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
      main{padding:10px}
    }
  </style>
</head>
<body>
<header>
  <h1>Golf Oly Pay</h1>
  <p>ゴルフ・オリンピックの入力、抽選、精算</p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="setup">設定</button>
    <button class="tab-btn" data-tab="input">入力</button>
    <button class="tab-btn" data-tab="status">状況</button>
    <button class="tab-btn" data-tab="draw">抽選</button>
    <button class="tab-btn" data-tab="settlement">精算</button>
  </div>

  <section id="setup" class="panel active">
    <div class="card">
      <h2>ゲーム設定</h2>
      <div class="grid grid-2">
        <div>
          <label>参加人数</label>
          <select id="playerCount"></select>
        </div>
        <div>
          <label>1ポイントの金額（USD）</label>
          <input id="rate" type="number" min="0" step="0.25" value="0.50" />
        </div>
        <div>
          <label>ホール数</label>
          <select id="holeCount">
            <option value="18">18ホール</option>
            <option value="9">9ホール</option>
          </select>
        </div>
        <div>
          <label>精算対象</label>
          <select id="targetMode">
            <option value="all">全ホール</option>
            <option value="draw">抽選ホールのみ</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>プレーヤー</h2>
      <div id="players"></div>
      <button class="btn btn-primary btn-block" id="saveSetup">設定を保存して開始</button>
    </div>

    <div class="card">
      <h3>ポイント</h3>
      <div class="grid grid-4">
        <div><label>鉄</label><input id="ironPoint" type="number" value="1" min="0"></div>
        <div><label>銅</label><input id="bronzePoint" type="number" value="2" min="0"></div>
        <div><label>銀</label><input id="silverPoint" type="number" value="3" min="0"></div>
        <div><label>金</label><input id="goldPoint" type="number" value="4" min="0"></div>
      </div>
      <p class="muted">各ポイントは、獲得者が他の全プレーヤーから同点数を受け取る方式です。</p>
    </div>

    <div class="card">
      <button class="btn btn-danger btn-block" id="resetAll">全データを初期化</button>
    </div>
  </section>

  <section id="input" class="panel">
    <div class="card">
      <div class="hole-head">
        <h2 id="holeTitle">第1ホール</h2>
        <div class="hole-nav">
          <button class="btn btn-secondary" id="prevHole">前へ</button>
          <button class="btn btn-secondary" id="nextHole">次へ</button>
        </div>
      </div>

      <div class="grid">
        <div class="medal iron">
          <label>鉄（1pt）</label>
          <select id="ironSelect"></select>
        </div>
        <div class="medal bronze">
          <label>銅（2pt）</label>
          <select id="bronzeSelect"></select>
        </div>
        <div class="medal silver">
          <label>銀（3pt）</label>
          <select id="silverSelect"></select>
        </div>
        <div class="medal gold">
          <label>金（4pt）</label>
          <select id="goldSelect"></select>
        </div>
      </div>

      <div style="margin-top:12px" class="grid grid-2">
        <button class="btn btn-primary" id="saveHole">このホールを保存</button>
        <button class="btn btn-danger" id="clearHole">このホールを消去</button>
      </div>
      <div id="holeSaved" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h3>入力済みホール</h3>
      <div id="enteredHoles" class="chips"></div>
    </div>
  </section>

  <section id="status" class="panel">
    <div class="card">
      <h2>現在の状況</h2>
      <div id="statusNote" class="notice"></div>
      <div style="overflow:auto;margin-top:10px">
        <table class="summary-table">
          <thead><tr><th>順位</th><th>プレーヤー</th><th>獲得pt</th><th>収支</th></tr></thead>
          <tbody id="statusBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>ホール別履歴</h3>
      <div id="history"></div>
    </div>
  </section>

  <section id="draw" class="panel">
    <div class="card">
      <h2>対象ホール抽選</h2>
      <div class="grid grid-2">
        <div>
          <label>抽選するホール数</label>
          <input id="drawCount" type="number" min="1" value="8">
        </div>
        <div>
          <label>重複</label>
          <select id="duplicateMode">
            <option value="no">なし</option>
            <option value="yes">あり</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px" id="runDraw">抽選する</button>
      <div id="drawResult" style="margin-top:12px"></div>
      <p class="muted">抽選ホールのみ精算する場合は、設定画面の「精算対象」を「抽選ホールのみ」にしてください。</p>
    </div>
  </section>

  <section id="settlement" class="panel">
    <div class="card">
      <h2>最終結果</h2>
      <div id="settlementNote"></div>
      <div style="overflow:auto;margin-top:10px">
        <table class="settle-table">
          <thead><tr><th>プレーヤー</th><th>最終収支</th></tr></thead>
          <tbody id="balanceBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>誰が誰にいくら払うか</h2>
      <div id="payments"></div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px" id="copyResult">結果をコピー</button>
    </div>
  </section>
</main>

<footer>データはこの端末のブラウザ内に保存されます。</footer>

<script>
const $ = (id)=>document.getElementById(id);
const STORE_KEY = "golfOlyPayDataV1";

const defaultState = {
  playerCount: 8,
  players: ["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6","Player 7","Player 8"],
  rate: 0.5,
  holeCount: 18,
  targetMode: "all",
  points: {iron:1, bronze:2, silver:3, gold:4},
  holes: {},
  draw: []
};

let state = loadState();
let currentHole = 1;

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? {...defaultState, ...JSON.parse(raw)} : structuredClone(defaultState);
  }catch(e){ return structuredClone(defaultState); }
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function init(){
  for(let i=2;i<=8;i++){
    const opt=document.createElement("option");
    opt.value=i; opt.textContent=i+"人";
    $("playerCount").appendChild(opt);
  }
  $("playerCount").value=state.playerCount;
  $("rate").value=state.rate;
  $("holeCount").value=state.holeCount;
  $("targetMode").value=state.targetMode;
  $("ironPoint").value=state.points.iron;
  $("bronzePoint").value=state.points.bronze;
  $("silverPoint").value=state.points.silver;
  $("goldPoint").value=state.points.gold;
  $("drawCount").value=Math.min(state.playerCount,state.holeCount);

  renderPlayers();
  renderHole();
  renderStatus();
  renderDraw();
  renderSettlement();
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      $(btn.dataset.tab).classList.add("active");
      if(btn.dataset.tab==="status") renderStatus();
      if(btn.dataset.tab==="settlement") renderSettlement();
    });
  });

  $("playerCount").addEventListener("change",()=>{
    state.playerCount=Number($("playerCount").value);
    while(state.players.length<state.playerCount) state.players.push("Player "+(state.players.length+1));
    state.players=state.players.slice(0,state.playerCount);
    $("drawCount").value=Math.min(state.playerCount,state.holeCount);
    renderPlayers();
  });

  $("saveSetup").addEventListener("click",()=>{
    const inputs=[...document.querySelectorAll(".player-name")];
    state.playerCount=Number($("playerCount").value);
    state.players=inputs.map((x,i)=>x.value.trim()||("Player "+(i+1)));
    state.rate=Number($("rate").value)||0;
    state.holeCount=Number($("holeCount").value);
    state.targetMode=$("targetMode").value;
    state.points={
      iron:Number($("ironPoint").value)||0,
      bronze:Number($("bronzePoint").value)||0,
      silver:Number($("silverPoint").value)||0,
      gold:Number($("goldPoint").value)||0
    };
    if(currentHole>state.holeCount) currentHole=state.holeCount;
    saveState();
    renderHole(); renderStatus(); renderSettlement();
    document.querySelector('[data-tab="input"]').click();
  });

  $("prevHole").addEventListener("click",()=>{currentHole=Math.max(1,currentHole-1);renderHole();});
  $("nextHole").addEventListener("click",()=>{currentHole=Math.min(state.holeCount,currentHole+1);renderHole();});

  $("saveHole").addEventListener("click",()=>{
    const vals={
      iron:$("ironSelect").value,
      bronze:$("bronzeSelect").value,
      silver:$("silverSelect").value,
      gold:$("goldSelect").value
    };
    const chosen=Object.values(vals).filter(Boolean);
    if(new Set(chosen).size!==chosen.length){
      alert("同じプレーヤーを複数のメダルに設定できません。");
      return;
    }
    state.holes[currentHole]=vals;
    saveState();
    $("holeSaved").innerHTML='<div class="success">保存しました。</div>';
    renderEnteredHoles();
    setTimeout(()=>{$("holeSaved").innerHTML="";},1200);
  });

  $("clearHole").addEventListener("click",()=>{
    delete state.holes[currentHole];
    saveState(); renderHole();
  });

  $("runDraw").addEventListener("click",()=>{
    const count=Math.max(1,Math.min(Number($("drawCount").value)||1,state.holeCount));
    const dup=$("duplicateMode").value==="yes";
    const arr=[];
    if(dup){
      for(let i=0;i<count;i++) arr.push(Math.floor(Math.random()*state.holeCount)+1);
    }else{
      const pool=Array.from({length:state.holeCount},(_,i)=>i+1);
      for(let i=pool.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [pool[i],pool[j]]=[pool[j],pool[i]];
      }
      arr.push(...pool.slice(0,count));
    }
    state.draw=arr.sort((a,b)=>a-b);
    saveState(); renderDraw(); renderStatus(); renderSettlement();
  });

  $("copyResult").addEventListener("click", async()=>{
    const text=buildCopyText();
    try{
      await navigator.clipboard.writeText(text);
      alert("精算結果をコピーしました。");
    }catch(e){
      prompt("以下をコピーしてください。",text);
    }
  });

  $("resetAll").addEventListener("click",()=>{
    if(confirm("すべての設定・入力・抽選結果を削除しますか？")){
      localStorage.removeItem(STORE_KEY);
      state=structuredClone(defaultState);
      location.reload();
    }
  });
}

function renderPlayers(){
  const wrap=$("players"); wrap.innerHTML="";
  for(let i=0;i<state.playerCount;i++){
    const row=document.createElement("div");
    row.className="player-row";
    row.innerHTML=`<div class="player-no">${i+1}</div>
      <input class="player-name" value="${escapeHtml(state.players[i]||("Player "+(i+1)))}">
      <div></div>`;
    wrap.appendChild(row);
  }
}

function playerOptions(selected=""){
  let html='<option value="">なし</option>';
  state.players.forEach((p,i)=>{
    const val=String(i);
    html+=`<option value="${val}" ${selected===val?"selected":""}>${escapeHtml(p)}</option>`;
  });
  return html;
}

function renderHole(){
  $("holeTitle").textContent=`第${currentHole}ホール`;
  const data=state.holes[currentHole]||{};
  $("ironSelect").innerHTML=playerOptions(data.iron??"");
  $("bronzeSelect").innerHTML=playerOptions(data.bronze??"");
  $("silverSelect").innerHTML=playerOptions(data.silver??"");
  $("goldSelect").innerHTML=playerOptions(data.gold??"");
  $("ironSelect").parentElement.querySelector("label").textContent=`鉄（${state.points.iron}pt）`;
  $("bronzeSelect").parentElement.querySelector("label").textContent=`銅（${state.points.bronze}pt）`;
  $("silverSelect").parentElement.querySelector("label").textContent=`銀（${state.points.silver}pt）`;
  $("goldSelect").parentElement.querySelector("label").textContent=`金（${state.points.gold}pt）`;
  renderEnteredHoles();
}

function renderEnteredHoles(){
  const wrap=$("enteredHoles"); wrap.innerHTML="";
  for(let i=1;i<=state.holeCount;i++){
    const b=document.createElement("button");
    b.className="chip"+(state.holes[i]?" selected-hole":"");
    b.textContent=i+"H";
    b.addEventListener("click",()=>{currentHole=i;renderHole();});
    wrap.appendChild(b);
  }
}

function getTargetHoleList(){
  if(state.targetMode==="draw"){
    return state.draw.length?state.draw:[];
  }
  return Array.from({length:state.holeCount},(_,i)=>i+1);
}

function calculate(){
  const n=state.playerCount;
  const points=Array(n).fill(0);
  const targetHoles=getTargetHoleList();
  const multiplicity={};
  targetHoles.forEach(h=>multiplicity[h]=(multiplicity[h]||0)+1);

  Object.entries(multiplicity).forEach(([h,mult])=>{
    const rec=state.holes[h];
    if(!rec) return;
    for(const medal of ["iron","bronze","silver","gold"]){
      if(rec[medal]!==undefined && rec[medal]!==null && rec[medal]!==""){
        const idx=Number(rec[medal]);
        points[idx]+=state.points[medal]*mult;
      }
    }
  });

  const balances=points.map((p,i)=>{
    const ownReceive=p*(n-1);
    const paidToOthers=points.reduce((s,x,j)=>s+(j===i?0:x),0);
    return (ownReceive-paidToOthers)*state.rate;
  });

  return {points,balances,targetHoles};
}

function renderStatus(){
  const {points,balances,targetHoles}=calculate();
  $("statusNote").textContent = state.targetMode==="draw"
    ? (state.draw.length?`抽選された ${state.draw.length} ホールを集計しています。`:"抽選ホールが未設定です。抽選画面でホールを選んでください。")
    : `全${state.holeCount}ホールを集計しています。`;

  const rows=state.players.map((p,i)=>({name:p,pt:points[i],bal:balances[i]}))
    .sort((a,b)=>b.bal-a.bal);
  $("statusBody").innerHTML=rows.map((r,i)=>`
    <tr><td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${r.pt}</td>
    <td class="${r.bal>=0?"positive":"negative"}">${fmtMoney(r.bal)}</td></tr>`).join("");

  const hist=[];
  for(let h=1;h<=state.holeCount;h++){
    const rec=state.holes[h];
    if(!rec) continue;
    const parts=[];
    for(const medal of ["iron","bronze","silver","gold"]){
      const idx=rec[medal];
      if(idx!=="" && idx!==undefined) parts.push(`${jpMedal(medal)}: ${escapeHtml(state.players[Number(idx)])}`);
    }
    hist.push(`<div class="card" style="padding:10px;margin-bottom:8px"><strong>${h}H</strong><br><span class="muted">${parts.join(" / ")||"入力なし"}</span></div>`);
  }
  $("history").innerHTML=hist.length?hist.join(""):'<p class="muted">まだ入力がありません。</p>';
}

function renderDraw(){
  if(!state.draw.length){
    $("drawResult").innerHTML='<p class="muted">まだ抽選していません。</p>';
    return;
  }
  $("drawResult").innerHTML=`<div class="success">対象ホール：${state.draw.map(h=>h+"H").join("、")}</div>`;
}

function minimizePayments(balances){
  const creditors=[], debtors=[];
  balances.forEach((b,i)=>{
    const v=Math.round(b*100)/100;
    if(v>0.009) creditors.push({i,amount:v});
    else if(v<-0.009) debtors.push({i,amount:-v});
  });
  creditors.sort((a,b)=>b.amount-a.amount);
  debtors.sort((a,b)=>b.amount-a.amount);
  const payments=[];
  let ci=0,di=0;
  while(ci<creditors.length && di<debtors.length){
    const c=creditors[ci], d=debtors[di];
    const amt=Math.min(c.amount,d.amount);
    payments.push({from:d.i,to:c.i,amount:Math.round(amt*100)/100});
    c.amount=Math.round((c.amount-amt)*100)/100;
    d.amount=Math.round((d.amount-amt)*100)/100;
    if(c.amount<0.01) ci++;
    if(d.amount<0.01) di++;
  }
  return payments;
}

function renderSettlement(){
  const {balances}=calculate();
  $("settlementNote").innerHTML = state.targetMode==="draw" && !state.draw.length
    ? '<div class="notice">抽選ホールが未設定のため、現在の精算額は0です。</div>'
    : '';
  $("balanceBody").innerHTML=state.players.map((p,i)=>`
    <tr><td>${escapeHtml(p)}</td><td class="${balances[i]>=0?"positive":"negative"}">${fmtMoney(balances[i])}</td></tr>
  `).join("");

  const pays=minimizePayments(balances);
  $("payments").innerHTML=pays.length
    ? pays.map(x=>`<div class="card" style="padding:10px;margin-bottom:8px">
        <strong>${escapeHtml(state.players[x.from])}</strong> → <strong>${escapeHtml(state.players[x.to])}</strong>
        <span style="float:right;font-weight:900">${fmtMoney(x.amount)}</span>
      </div>`).join("")
    : '<div class="success">支払いはありません。</div>';
}

function buildCopyText(){
  const {balances}=calculate();
  const pays=minimizePayments(balances);
  let t="Golf Oly Pay 精算結果\n\n";
  state.players.forEach((p,i)=>{t+=`${p}: ${fmtMoney(balances[i])}\n`;});
  t+="\n支払い\n";
  if(!pays.length) t+="支払いなし\n";
  else pays.forEach(x=>{t+=`${state.players[x.from]} → ${state.players[x.to]}: ${fmtMoney(x.amount)}\n`;});
  return t;
}

function fmtMoney(v){
  const sign=v>0?"+":v<0?"-":"";
  return sign+"$"+Math.abs(v).toFixed(2);
}
function jpMedal(m){return {iron:"鉄",bronze:"銅",silver:"銀",gold:"金"}[m];}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

init();
</script>
</body>
</html>
