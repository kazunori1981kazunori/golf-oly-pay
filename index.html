<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf Oly Pay">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Golf Oly Pay</title>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f4f7f5;--card:#fff;--line:#dce5df;--txt:#1f2937;--muted:#6b7280;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:18px 16px calc(14px + env(safe-area-inset-top));box-shadow:0 2px 10px #0002}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:900px;margin:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
nav button{border:0;border-radius:10px;padding:10px 3px;font-weight:800;background:#e5ece8;font-size:12px}
nav button.active{background:var(--g);color:#fff}
section{display:none}section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
h2,h3{margin-top:0}h2{font-size:18px}h3{font-size:16px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ccd8d1;background:#fff}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900}.primary{background:var(--g);color:#fff}.secondary{background:#e6ece9}.danger{background:#fee4e2;color:var(--red)}.block{width:100%}
.player{display:grid;grid-template-columns:34px 1fr 92px;gap:8px;align-items:center;margin-bottom:8px}
.no{height:32px;width:32px;border-radius:50%;display:grid;place-items:center;background:#e3f1e8;color:var(--g);font-weight:900}
.groupSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.groupSwitch button{border:2px solid transparent;border-radius:12px;padding:12px;font-weight:900}.groupSwitch .a{background:#e5f4ea}.groupSwitch .b{background:#e9effa}.groupSwitch .active{border-color:var(--g)}
.holeHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.navBtns{display:flex;gap:6px}
.medal{border-left:5px solid;padding-left:10px}.iron{border-color:#44515e}.bronze{border-color:#a86f32}.silver{border-color:#7c8794}.gold{border-color:#d4a017}
.note{padding:10px 12px;border-radius:10px;background:#fff4ce;border:1px solid #efd26d;font-size:13px}.ok{padding:10px 12px;border-radius:10px;background:#dcfae6;border:1px solid #86d49f;color:#0d5d35;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#eef3f0}.chip.done{background:#dff4e8;border-color:#8ad2a7}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f4f2}
.pos{color:#087443;font-weight:900}.neg{color:var(--red);font-weight:900}.muted{color:var(--muted);font-size:12px}
.pay{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
@media(max-width:650px){.g2,.g4{grid-template-columns:1fr}.player{grid-template-columns:32px 1fr 84px}}
</style>
</head>
<body>
<header><h1>Golf Oly Pay</h1><p>人数・組数を自由に設定して、参加者全員で精算</p></header>
<main>
<nav>
<button class="active" data-tab="setup">設定</button>
<button data-tab="input">入力</button>
<button data-tab="status">状況</button>
<button data-tab="draw">抽選</button>
<button data-tab="settle">精算</button>
</nav>

<section id="setup" class="active">
<div class="card">
<h2>基本設定</h2>
<div class="grid g2">
<div><label>参加人数</label><select id="playerCount"></select></div><div><label>組数</label><select id="groupCount"></select></div>
<div><label>1ポイントの金額（USD）</label><input id="rate" type="number" value="0.5" min="0" step="0.25"></div>
<div><label>ホール数</label><select id="holes"><option value="18">18ホール</option><option value="9">9ホール</option></select></div>
<div><label>精算対象</label><select id="target"><option value="all">全ホール</option><option value="draw">抽選ホールのみ</option></select></div>
</div>
</div>
<div class="card">
<h2>プレーヤーと組分け</h2>
<div id="players"></div>
<div id="groupMsg"></div>
<button class="btn secondary block" id="autoAssign" style="margin-bottom:10px">組分けを均等にする</button><button class="btn primary block" id="saveSetup">保存して入力へ</button>
</div>
<div class="card">
<h3>ポイント</h3>
<div class="grid g4">
<div><label>鉄</label><input id="pIron" type="number" value="1"></div>
<div><label>銅</label><input id="pBronze" type="number" value="2"></div>
<div><label>銀</label><input id="pSilver" type="number" value="3"></div>
<div><label>金</label><input id="pGold" type="number" value="4"></div>
</div>
<p class="muted">各組で獲得したポイントを合算し、最後は8名全員で精算します。</p>
</div>
<div class="card"><button class="btn danger block" id="reset">全データを初期化</button></div>
</section>

<section id="input">
<div class="groupSwitch">
<button class="a active" data-group="A">A組</button>
<button class="b" data-group="B">B組</button>
</div>
<div class="card">
<div class="holeHead">
<div><h2 id="holeTitle">A組・1H</h2><div id="members" class="muted"></div></div>
<div class="navBtns"><button class="btn secondary" id="prev">前へ</button><button class="btn secondary" id="next">次へ</button></div>
</div>
<div class="grid">
<div class="medal iron"><label>鉄</label><select id="iron"></select></div>
<div class="medal bronze"><label>銅</label><select id="bronze"></select></div>
<div class="medal silver"><label>銀</label><select id="silver"></select></div>
<div class="medal gold"><label>金</label><select id="gold"></select></div>
</div>
<div class="grid g2" style="margin-top:12px">
<button class="btn primary" id="saveHole">このホールを保存</button>
<button class="btn danger" id="clearHole">消去</button>
</div>
<div id="saved" style="margin-top:10px"></div>
</div>
<div class="card"><h3>入力済みホール</h3><div id="chips" class="chips"></div></div>
</section>

<section id="status">
<div class="card">
<h2>8名全員の状況</h2><div id="statusNote" class="note"></div>
<div style="overflow:auto;margin-top:10px"><table><thead><tr><th>順位</th><th>組</th><th>名前</th><th>pt</th><th>収支</th></tr></thead><tbody id="statusBody"></tbody></table></div>
</div>
</section>

<section id="draw">
<div class="card">
<h2>対象ホール抽選</h2>
<div class="grid g2">
<div><label>抽選ホール数</label><input id="drawCount" type="number" value="8" min="1"></div>
<div><label>重複</label><select id="dup"><option value="no">なし</option><option value="yes">あり</option></select></div>
</div>
<button class="btn primary block" style="margin-top:12px" id="runDraw">抽選する</button>
<div id="drawResult" style="margin-top:10px"></div>
</div>
</section>

<section id="settle">
<div class="card">
<h2>最終収支</h2>
<div style="overflow:auto"><table><thead><tr><th>組</th><th>名前</th><th>収支</th></tr></thead><tbody id="balanceBody"></tbody></table></div>
</div>
<div class="card">
<h2>誰が誰にいくら払うか</h2><div id="payments"></div>
<button class="btn secondary block" id="copy">結果をコピー</button>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id),KEY="golfOlyPayFlexibleV2";
const D={playerCount:8,groupCount:2,players:Array.from({length:8},(_,i)=>`Player ${i+1}`),groups:[1,1,1,1,2,2,2,2],rate:.5,holeCount:18,target:"all",points:{iron:1,bronze:2,silver:3,gold:4},data:{"1":{},"2":{}},draw:[]};
let s=load(),g=1,hole=1;
function cp(){return JSON.parse(JSON.stringify(D))}function load(){try{return Object.assign(cp(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return cp()}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return(v>0?"+":v<0?"-":"")+"$"+Math.abs(v).toFixed(2)}
function norm(){s.players=s.players.slice(0,s.playerCount);while(s.players.length<s.playerCount)s.players.push(`Player ${s.players.length+1}`);s.groups=s.groups.slice(0,s.playerCount);while(s.groups.length<s.playerCount)s.groups.push((s.groups.length%s.groupCount)+1);s.groups=s.groups.map(x=>Math.min(Math.max(+x||1,1),s.groupCount));for(let i=1;i<=s.groupCount;i++)s.data[String(i)]??={};Object.keys(s.data).forEach(k=>{if(+k>s.groupCount)delete s.data[k]});if(g>s.groupCount)g=1}
function idxs(gr){return s.groups.map((x,i)=>+x===+gr?i:null).filter(x=>x!==null)}function opts(gr,sel=""){let z='<option value="">なし</option>';idxs(gr).forEach(i=>z+=`<option value="${i}" ${String(i)===sel?"selected":""}>${esc(s.players[i])}</option>`);return z}
function init(){for(let i=2;i<=16;i++)$("playerCount").innerHTML+=`<option value="${i}">${i}人</option>`;for(let i=1;i<=4;i++)$("groupCount").innerHTML+=`<option value="${i}">${i}組</option>`;norm();$("playerCount").value=s.playerCount;$("groupCount").value=s.groupCount;$("rate").value=s.rate;$("holes").value=s.holeCount;$("target").value=s.target;$("pIron").value=s.points.iron;$("pBronze").value=s.points.bronze;$("pSilver").value=s.points.silver;$("pGold").value=s.points.gold;renderPlayers();renderGroups();renderHole();renderStatus();renderDraw();renderSettle();
$("playerCount").onchange=()=>{s.playerCount=+$("playerCount").value;norm();renderPlayers()};$("groupCount").onchange=()=>{s.groupCount=+$("groupCount").value;norm();renderPlayers();renderGroups();renderHole()};$("autoAssign").onclick=()=>{s.groups=Array.from({length:s.playerCount},(_,i)=>(i%s.groupCount)+1);renderPlayers()};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");if(b.dataset.tab==="status")renderStatus();if(b.dataset.tab==="settle")renderSettle()});
$("saveSetup").onclick=saveSetup;$("prev").onclick=()=>{hole=Math.max(1,hole-1);renderHole()};$("next").onclick=()=>{hole=Math.min(s.holeCount,hole+1);renderHole()};$("saveHole").onclick=saveHole;$("clearHole").onclick=()=>{delete s.data[String(g)][hole];save();renderHole()};$("runDraw").onclick=runDraw;$("copy").onclick=copyResult;$("reset").onclick=()=>{if(confirm("すべて削除しますか？")){localStorage.removeItem(KEY);location.reload()}}}
function renderPlayers(){let w=$("players");w.innerHTML="";s.players.forEach((p,i)=>{let o="";for(let n=1;n<=s.groupCount;n++)o+=`<option value="${n}" ${+s.groups[i]===n?"selected":""}>${n}組</option>`;w.innerHTML+=`<div class="player"><div class="no">${i+1}</div><input class="pname" value="${esc(p)}"><select class="pgroup">${o}</select></div>`});document.querySelectorAll(".pgroup").forEach(x=>x.onchange=counts);counts()}
function counts(){let a=[...document.querySelectorAll(".pgroup")].map(x=>+x.value),t=[];for(let n=1;n<=s.groupCount;n++)t.push(`${n}組 ${a.filter(x=>x===n).length}名`);$("groupMsg").innerHTML=`<div class="ok">${t.join("／")}</div>`}
function saveSetup(){s.playerCount=+$("playerCount").value;s.groupCount=+$("groupCount").value;s.players=[...document.querySelectorAll(".pname")].map((x,i)=>x.value.trim()||`Player ${i+1}`);s.groups=[...document.querySelectorAll(".pgroup")].map(x=>+x.value);if(new Set(s.groups).size<s.groupCount){alert("すべての組に少なくとも1名を割り当ててください。");return}s.rate=+$("rate").value||0;s.holeCount=+$("holes").value;s.target=$("target").value;s.points={iron:+$("pIron").value||0,bronze:+$("pBronze").value||0,silver:+$("pSilver").value||0,gold:+$("pGold").value||0};norm();save();renderGroups();renderHole();document.querySelector('[data-tab="input"]').click()}
function renderGroups(){let w=$("groupSwitch");w.innerHTML="";w.style.gridTemplateColumns=`repeat(${Math.min(s.groupCount,4)},1fr)`;for(let n=1;n<=s.groupCount;n++){let b=document.createElement("button");b.textContent=`${n}組`;if(n===g)b.classList.add("active");b.onclick=()=>{g=n;document.querySelectorAll("#groupSwitch button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderHole()};w.appendChild(b)}}
function renderHole(){let d=s.data[String(g)]?.[hole]||{};$("holeTitle").textContent=`${g}組・${hole}H`;$("members").textContent=idxs(g).map(i=>s.players[i]).join("、");$("iron").innerHTML=opts(g,d.iron??"");$("bronze").innerHTML=opts(g,d.bronze??"");$("silver").innerHTML=opts(g,d.silver??"");$("gold").innerHTML=opts(g,d.gold??"");["iron","bronze","silver","gold"].forEach(k=>$(k).parentElement.querySelector("label").textContent=`${{iron:"鉄",bronze:"銅",silver:"銀",gold:"金"}[k]}（${s.points[k]}pt）`);renderChips()}
function saveHole(){let d={iron:$("iron").value,bronze:$("bronze").value,silver:$("silver").value,gold:$("gold").value},v=Object.values(d).filter(Boolean);if(new Set(v).size!==v.length){alert("同じ人を複数選べません。");return}s.data[String(g)][hole]=d;save();$("saved").innerHTML='<div class="ok">保存しました。</div>';renderChips();setTimeout(()=>$("saved").innerHTML="",900)}
function renderChips(){let w=$("chips");w.innerHTML="";for(let i=1;i<=s.holeCount;i++){let b=document.createElement("button");b.className="chip"+(s.data[String(g)]?.[i]?" done":"");b.textContent=i+"H";b.onclick=()=>{hole=i;renderHole()};w.appendChild(b)}}
function targets(){return s.target==="draw"?s.draw:Array.from({length:s.holeCount},(_,i)=>i+1)}function calc(){let n=s.playerCount,p=Array(n).fill(0),m={};targets().forEach(x=>m[x]=(m[x]||0)+1);for(let gr=1;gr<=s.groupCount;gr++)Object.entries(m).forEach(([hh,c])=>{let d=s.data[String(gr)]?.[hh];if(!d)return;["iron","bronze","silver","gold"].forEach(k=>{if(d[k]!=="")p[+d[k]]+=s.points[k]*c})});let b=p.map((x,i)=>(x*(n-1)-p.reduce((q,y,j)=>q+(j===i?0:y),0))*s.rate);return{p,b}}
function renderStatus(){let {p,b}=calc(),r=s.players.map((n,i)=>({n,i,g:s.groups[i],p:p[i],b:b[i]})).sort((x,y)=>y.b-x.b);$("statusNote").textContent=s.target==="draw"?(s.draw.length?`抽選${s.draw.length}ホールを集計中`:"抽選未実施"):`全${s.holeCount}ホールを集計中`;$("statusBody").innerHTML=r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.g}</td><td>${esc(x.n)}</td><td>${x.p}</td><td class="${x.b>=0?"pos":"neg"}">${money(x.b)}</td></tr>`).join("")}
function runDraw(){let c=Math.max(1,Math.min(+$("drawCount").value||1,s.holeCount)),dup=$("dup").value==="yes",a=[];if(dup){for(let i=0;i<c;i++)a.push(Math.floor(Math.random()*s.holeCount)+1)}else{let p=Array.from({length:s.holeCount},(_,i)=>i+1);for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}a.push(...p.slice(0,c))}s.draw=a.sort((x,y)=>x-y);save();renderDraw()}function renderDraw(){$("drawResult").innerHTML=s.draw.length?`<div class="ok">${s.draw.map(x=>x+"H").join("、")}</div>`:'<div class="muted">まだ抽選していません。</div>'}
function pays(b){let c=[],d=[];b.forEach((x,i)=>{x=Math.round(x*100)/100;if(x>.009)c.push({i,a:x});else if(x<-.009)d.push({i,a:-x})});c.sort((x,y)=>y.a-x.a);d.sort((x,y)=>y.a-x.a);let p=[],i=0,j=0;while(i<c.length&&j<d.length){let a=Math.min(c[i].a,d[j].a);p.push({f:d[j].i,t:c[i].i,a});c[i].a-=a;d[j].a-=a;if(c[i].a<.01)i++;if(d[j].a<.01)j++}return p}
function renderSettle(){let {b}=calc(),p=pays(b);$("balanceBody").innerHTML=s.players.map((n,i)=>`<tr><td>${s.groups[i]}</td><td>${esc(n)}</td><td class="${b[i]>=0?"pos":"neg"}">${money(b[i])}</td></tr>`).join("");$("payments").innerHTML=p.length?p.map(x=>`<div class="pay"><span><strong>${esc(s.players[x.f])}</strong> → <strong>${esc(s.players[x.t])}</strong></span><strong>${money(x.a)}</strong></div>`).join(""):'<div class="ok">支払いはありません。</div>'}
async function copyResult(){let {b}=calc(),p=pays(b),t=`Golf Oly Pay（${s.playerCount}人・${s.groupCount}組）\n\n`;s.players.forEach((n,i)=>t+=`${s.groups[i]}組 ${n}: ${money(b[i])}\n`);t+="\n支払い\n";p.forEach(x=>t+=`${s.players[x.f]} → ${s.players[x.t]}: ${money(x.a)}\n`);try{await navigator.clipboard.writeText(t);alert("コピーしました。")}catch{prompt("コピーしてください",t)}}
init();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script>
</body>
</html>
