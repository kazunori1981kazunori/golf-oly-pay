<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf Oly Pay">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Golf Oly Pay</title>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f4f7f5;--card:#fff;--line:#dce5df;--txt:#1f2937;--muted:#6b7280;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:18px 16px calc(14px + env(safe-area-inset-top));box-shadow:0 2px 10px #0002}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:900px;margin:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
nav button{border:0;border-radius:10px;padding:10px 3px;font-weight:800;background:#e5ece8;font-size:12px}
nav button.active{background:var(--g);color:#fff}
section{display:none}section.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
h2,h3{margin-top:0}h2{font-size:18px}h3{font-size:16px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ccd8d1;background:#fff}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900}.primary{background:var(--g);color:#fff}.secondary{background:#e6ece9}.danger{background:#fee4e2;color:var(--red)}.block{width:100%}
.player{display:grid;grid-template-columns:34px 1fr 92px;gap:8px;align-items:center;margin-bottom:8px}
.no{height:32px;width:32px;border-radius:50%;display:grid;place-items:center;background:#e3f1e8;color:var(--g);font-weight:900}
.groupSwitch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.groupSwitch button{border:2px solid transparent;border-radius:12px;padding:12px;font-weight:900}.groupSwitch .a{background:#e5f4ea}.groupSwitch .b{background:#e9effa}.groupSwitch .active{border-color:var(--g)}
.holeHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.navBtns{display:flex;gap:6px}
.medal{border-left:5px solid;padding-left:10px}.iron{border-color:#44515e}.bronze{border-color:#a86f32}.silver{border-color:#7c8794}.gold{border-color:#d4a017}
.note{padding:10px 12px;border-radius:10px;background:#fff4ce;border:1px solid #efd26d;font-size:13px}.ok{padding:10px 12px;border-radius:10px;background:#dcfae6;border:1px solid #86d49f;color:#0d5d35;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#eef3f0}.chip.done{background:#dff4e8;border-color:#8ad2a7}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f4f2}
.pos{color:#087443;font-weight:900}.neg{color:var(--red);font-weight:900}.muted{color:var(--muted);font-size:12px}
.pay{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
@media(max-width:650px){.g2,.g4{grid-template-columns:1fr}.player{grid-template-columns:32px 1fr 84px}}
</style>
</head>
<body>
<header><h1>Golf Oly Pay</h1><p>4名×2組でプレーし、8名全員で精算</p></header>
<main>
<nav>
<button class="active" data-tab="setup">設定</button>
<button data-tab="input">入力</button>
<button data-tab="status">状況</button>
<button data-tab="draw">抽選</button>
<button data-tab="settle">精算</button>
</nav>

<section id="setup" class="active">
<div class="card">
<h2>基本設定</h2>
<div class="grid g2">
<div><label>参加人数</label><input value="8人（4名×2組）" disabled></div>
<div><label>1ポイントの金額（USD）</label><input id="rate" type="number" value="0.5" min="0" step="0.25"></div>
<div><label>ホール数</label><select id="holes"><option value="18">18ホール</option><option value="9">9ホール</option></select></div>
<div><label>精算対象</label><select id="target"><option value="all">全ホール</option><option value="draw">抽選ホールのみ</option></select></div>
</div>
</div>
<div class="card">
<h2>プレーヤーと組分け</h2>
<div id="players"></div>
<div id="groupMsg"></div>
<button class="btn primary block" id="saveSetup">保存して入力へ</button>
</div>
<div class="card">
<h3>ポイント</h3>
<div class="grid g4">
<div><label>鉄</label><input id="pIron" type="number" value="1"></div>
<div><label>銅</label><input id="pBronze" type="number" value="2"></div>
<div><label>銀</label><input id="pSilver" type="number" value="3"></div>
<div><label>金</label><input id="pGold" type="number" value="4"></div>
</div>
<p class="muted">各組で獲得したポイントを合算し、最後は8名全員で精算します。</p>
</div>
<div class="card"><button class="btn danger block" id="reset">全データを初期化</button></div>
</section>

<section id="input">
<div class="groupSwitch">
<button class="a active" data-group="A">A組</button>
<button class="b" data-group="B">B組</button>
</div>
<div class="card">
<div class="holeHead">
<div><h2 id="holeTitle">A組・1H</h2><div id="members" class="muted"></div></div>
<div class="navBtns"><button class="btn secondary" id="prev">前へ</button><button class="btn secondary" id="next">次へ</button></div>
</div>
<div class="grid">
<div class="medal iron"><label>鉄</label><select id="iron"></select></div>
<div class="medal bronze"><label>銅</label><select id="bronze"></select></div>
<div class="medal silver"><label>銀</label><select id="silver"></select></div>
<div class="medal gold"><label>金</label><select id="gold"></select></div>
</div>
<div class="grid g2" style="margin-top:12px">
<button class="btn primary" id="saveHole">このホールを保存</button>
<button class="btn danger" id="clearHole">消去</button>
</div>
<div id="saved" style="margin-top:10px"></div>
</div>
<div class="card"><h3>入力済みホール</h3><div id="chips" class="chips"></div></div>
</section>

<section id="status">
<div class="card">
<h2>8名全員の状況</h2><div id="statusNote" class="note"></div>
<div style="overflow:auto;margin-top:10px"><table><thead><tr><th>順位</th><th>組</th><th>名前</th><th>pt</th><th>収支</th></tr></thead><tbody id="statusBody"></tbody></table></div>
</div>
</section>

<section id="draw">
<div class="card">
<h2>対象ホール抽選</h2>
<div class="grid g2">
<div><label>抽選ホール数</label><input id="drawCount" type="number" value="8" min="1"></div>
<div><label>重複</label><select id="dup"><option value="no">なし</option><option value="yes">あり</option></select></div>
</div>
<button class="btn primary block" style="margin-top:12px" id="runDraw">抽選する</button>
<div id="drawResult" style="margin-top:10px"></div>
</div>
</section>

<section id="settle">
<div class="card">
<h2>最終収支</h2>
<div style="overflow:auto"><table><thead><tr><th>組</th><th>名前</th><th>収支</th></tr></thead><tbody id="balanceBody"></tbody></table></div>
</div>
<div class="card">
<h2>誰が誰にいくら払うか</h2><div id="payments"></div>
<button class="btn secondary block" id="copy">結果をコピー</button>
</div>
</section>
</main>

<script>
const $=id=>document.getElementById(id), KEY="golfOlyPayIPhoneV1";
const def={players:["Player 1","Player 2","Player 3","Player 4","Player 5","Player 6","Player 7","Player 8"],groups:["A","A","A","A","B","B","B","B"],rate:.5,holeCount:18,target:"all",points:{iron:1,bronze:2,silver:3,gold:4},data:{A:{},B:{}},draw:[]};
let st=load(),grp="A",hole=1;
function clone(){return JSON.parse(JSON.stringify(def))}function load(){try{return Object.assign(clone(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{return clone()}}function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return (v>0?"+":v<0?"-":"")+"$"+Math.abs(v).toFixed(2)}
function members(g){return st.groups.map((x,i)=>x===g?i:null).filter(x=>x!==null)}
function opts(g,sel=""){let h='<option value="">なし</option>';members(g).forEach(i=>h+=`<option value="${i}" ${String(i)===sel?"selected":""}>${esc(st.players[i])}</option>`);return h}
function init(){
$("rate").value=st.rate;$("holes").value=st.holeCount;$("target").value=st.target;$("pIron").value=st.points.iron;$("pBronze").value=st.points.bronze;$("pSilver").value=st.points.silver;$("pGold").value=st.points.gold;
renderPlayers();renderHole();renderStatus();renderDraw();renderSettle();
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");if(b.dataset.tab==="status")renderStatus();if(b.dataset.tab==="settle")renderSettle()});
document.querySelectorAll(".groupSwitch button").forEach(b=>b.onclick=()=>{grp=b.dataset.group;document.querySelectorAll(".groupSwitch button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderHole()});
$("saveSetup").onclick=saveSetup;$("prev").onclick=()=>{hole=Math.max(1,hole-1);renderHole()};$("next").onclick=()=>{hole=Math.min(st.holeCount,hole+1);renderHole()};
$("saveHole").onclick=saveHole;$("clearHole").onclick=()=>{delete st.data[grp][hole];save();renderHole()};
$("runDraw").onclick=runDraw;$("copy").onclick=copyResult;$("reset").onclick=()=>{if(confirm("すべて削除しますか？")){localStorage.removeItem(KEY);location.reload()}};
}
function renderPlayers(){const w=$("players");w.innerHTML="";st.players.forEach((p,i)=>{w.innerHTML+=`<div class="player"><div class="no">${i+1}</div><input class="pname" value="${esc(p)}"><select class="pgroup"><option value="A" ${st.groups[i]==="A"?"selected":""}>A組</option><option value="B" ${st.groups[i]==="B"?"selected":""}>B組</option></select></div>`});document.querySelectorAll(".pgroup").forEach(x=>x.onchange=groupCount);groupCount()}
function groupCount(){const a=[...document.querySelectorAll(".pgroup")].filter(x=>x.value==="A").length,b=8-a;$("groupMsg").innerHTML=a===4?'<div class="ok">A組4名・B組4名です。</div>':`<div class="note">現在 A組${a}名／B組${b}名。各4名にしてください。</div>`}
function saveSetup(){const gs=[...document.querySelectorAll(".pgroup")].map(x=>x.value);if(gs.filter(x=>x==="A").length!==4){alert("A組4名、B組4名にしてください。");return}st.players=[...document.querySelectorAll(".pname")].map((x,i)=>x.value.trim()||`Player ${i+1}`);st.groups=gs;st.rate=Number($("rate").value)||0;st.holeCount=Number($("holes").value);st.target=$("target").value;st.points={iron:Number($("pIron").value)||0,bronze:Number($("pBronze").value)||0,silver:Number($("pSilver").value)||0,gold:Number($("pGold").value)||0};save();document.querySelector('[data-tab="input"]').click();renderHole()}
function renderHole(){const d=st.data[grp][hole]||{};$("holeTitle").textContent=`${grp}組・${hole}H`;$("members").textContent=members(grp).map(i=>st.players[i]).join("、");$("iron").innerHTML=opts(grp,d.iron??"");$("bronze").innerHTML=opts(grp,d.bronze??"");$("silver").innerHTML=opts(grp,d.silver??"");$("gold").innerHTML=opts(grp,d.gold??"");["iron","bronze","silver","gold"].forEach(k=>$(k).parentElement.querySelector("label").textContent=`${{iron:"鉄",bronze:"銅",silver:"銀",gold:"金"}[k]}（${st.points[k]}pt）`);renderChips()}
function saveHole(){const d={iron:$("iron").value,bronze:$("bronze").value,silver:$("silver").value,gold:$("gold").value},v=Object.values(d).filter(Boolean);if(new Set(v).size!==v.length){alert("同じ人を複数選べません。");return}st.data[grp][hole]=d;save();$("saved").innerHTML='<div class="ok">保存しました。</div>';renderChips();setTimeout(()=>$("saved").innerHTML="",1000)}
function renderChips(){const w=$("chips");w.innerHTML="";for(let i=1;i<=st.holeCount;i++){const b=document.createElement("button");b.className="chip"+(st.data[grp][i]?" done":"");b.textContent=i+"H";b.onclick=()=>{hole=i;renderHole()};w.appendChild(b)}}
function targets(){return st.target==="draw"?st.draw:Array.from({length:st.holeCount},(_,i)=>i+1)}
function calc(){const pts=Array(8).fill(0),m={};targets().forEach(h=>m[h]=(m[h]||0)+1);["A","B"].forEach(g=>Object.entries(m).forEach(([h,n])=>{const d=st.data[g][h];if(!d)return;["iron","bronze","silver","gold"].forEach(k=>{if(d[k]!=="")pts[Number(d[k])]+=st.points[k]*n})}));const bal=pts.map((p,i)=>(p*7-pts.reduce((s,x,j)=>s+(j===i?0:x),0))*st.rate);return{pts,bal}}
function renderStatus(){const {pts,bal}=calc();$("statusNote").textContent=st.target==="draw"?(st.draw.length?`抽選${st.draw.length}ホールを集計中`:"抽選未実施"):`全${st.holeCount}ホールを集計中`;const rows=st.players.map((n,i)=>({n,i,g:st.groups[i],p:pts[i],b:bal[i]})).sort((a,b)=>b.b-a.b);$("statusBody").innerHTML=rows.map((r,k)=>`<tr><td>${k+1}</td><td>${r.g}</td><td>${esc(r.n)}</td><td>${r.p}</td><td class="${r.b>=0?"pos":"neg"}">${money(r.b)}</td></tr>`).join("")}
function runDraw(){const c=Math.max(1,Math.min(Number($("drawCount").value)||1,st.holeCount)),dup=$("dup").value==="yes",a=[];if(dup){for(let i=0;i<c;i++)a.push(Math.floor(Math.random()*st.holeCount)+1)}else{const p=Array.from({length:st.holeCount},(_,i)=>i+1);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}a.push(...p.slice(0,c))}st.draw=a.sort((a,b)=>a-b);save();renderDraw()}
function renderDraw(){$("drawResult").innerHTML=st.draw.length?`<div class="ok">${st.draw.map(x=>x+"H").join("、")}</div>`:'<div class="muted">まだ抽選していません。</div>'}
function payments(bal){const c=[],d=[];bal.forEach((x,i)=>{x=Math.round(x*100)/100;if(x>.009)c.push({i,a:x});else if(x<-.009)d.push({i,a:-x})});c.sort((a,b)=>b.a-a.a);d.sort((a,b)=>b.a-a.a);const p=[];let i=0,j=0;while(i<c.length&&j<d.length){const a=Math.min(c[i].a,d[j].a);p.push({f:d[j].i,t:c[i].i,a});c[i].a-=a;d[j].a-=a;if(c[i].a<.01)i++;if(d[j].a<.01)j++}return p}
function renderSettle(){const {bal}=calc();$("balanceBody").innerHTML=st.players.map((n,i)=>`<tr><td>${st.groups[i]}</td><td>${esc(n)}</td><td class="${bal[i]>=0?"pos":"neg"}">${money(bal[i])}</td></tr>`).join("");const p=payments(bal);$("payments").innerHTML=p.length?p.map(x=>`<div class="pay"><span><strong>${esc(st.players[x.f])}</strong> → <strong>${esc(st.players[x.t])}</strong></span><strong>${money(x.a)}</strong></div>`).join(""):'<div class="ok">支払いはありません。</div>'}
async function copyResult(){const {bal}=calc(),p=payments(bal);let t="Golf Oly Pay\n\n";st.players.forEach((n,i)=>t+=`${st.groups[i]}組 ${n}: ${money(bal[i])}\n`);t+="\n支払い\n";p.forEach(x=>t+=`${st.players[x.f]} → ${st.players[x.t]}: ${money(x.a)}\n`);try{await navigator.clipboard.writeText(t);alert("コピーしました。")}catch{prompt("コピーしてください",t)}}
init();
</script>
<script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script>
</body>
</html>
